# Natal Notes publishing calendar: one post every other day, never more than one per run.
# The scheduled task publishes the first entry whose `date` is today or earlier and whose
# status is planned, as long as nothing was published in the last 40 hours. Missed days are
# never backfilled: if a run is missed, the next run publishes one item and the rest slide.
#
# Monthly rhythm (keeps each month's forecasts live before the month starts):
#   overview for month M   ~28 days before M
#   12 sign forecasts      every other day after that, finishing a few days before M
#   guides                 fill the 1-2 leftover slots each month
# Sign order rotates by one each month so no sign is always last.
# kinds: guide (slug), overview (month), forecast (month + sign). Keywords come from
# Google autocomplete research (content/keywords.md).

