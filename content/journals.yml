# The 12 Natal Notes Daily Journals. "buy" is the link every button uses.
# Eight are Rogenie's Amazon Associates short links; the other four use the same
# Associates tag (rogeniecord0c-20) on the plain product page until short links are made.
# Element, modality, ruler and both date ranges are checkable basics; keep them accurate.
# "pattern" and "pen" are written in the Natal Notes voice: tendencies, never fate.
# "affirmation" is copied word for word from the journal (natalnotes_affirmations.txt).

- sign: Aries
  slug: aries
  asin: B0C2S71SGC
  buy: https://link.amazon/B082n6Gph
  element: Fire
  modality: Cardinal
  ruler: Mars
  tropical: Mar 21 – Apr 19
  sidereal: Apr 14 – May 14
  pattern: >-
    You start fast and you start loud, and a lot of Aries quietly drop the thing the minute it
    stops being exciting. The pattern isn't laziness. It's mistaking momentum for direction.
  pen: >-
    What did you start this year and abandon at the hard part? Write the very next step, one
    step only, and the day you'll take it.
  affirmation: I take small steps every day

- sign: Taurus
  slug: taurus
  asin: B0C47R3HP2
  buy: https://www.amazon.com/dp/B0C47R3HP2?tag=rogeniecord0c-20
  element: Earth
  modality: Fixed
  ruler: Venus
  tropical: Apr 20 – May 20
  sidereal: May 15 – Jun 14
  pattern: >-
    Taurus builds a beautiful, comfortable life, then stays inside it long after it stopped
    fitting. Loyal is your strength. Staying put because change is uncomfortable is the trap.
  pen: >-
    Name one thing you keep because it's familiar, not because it's good for you. Write what
    you'd lose by letting it go, and what you'd get back.
  affirmation: I am open to letting go of what no longer serves me

- sign: Gemini
  slug: gemini
  asin: B0C47WF128
  buy: https://www.amazon.com/dp/B0C47WF128?tag=rogeniecord0c-20
  element: Air
  modality: Mutable
  ruler: Mercury
  tropical: May 21 – Jun 20
  sidereal: Jun 15 – Jul 15
  pattern: >-
    Ten tabs open, three group chats, a fresh plan every week. Many Geminis talk a decision
    through so many times that talking about it becomes the way they avoid making it.
  pen: >-
    Write down the decision you keep circling. One sentence for each side. Then choose, on
    paper, before you close the journal.
  affirmation: Little by little, day by day, I am closer to achieving my goals

- sign: Cancer
  slug: cancer
  asin: B0C47LSGP1
  buy: https://link.amazon/B0iXzlJkP
  element: Water
  modality: Cardinal
  ruler: Moon
  tropical: Jun 21 – Jul 22
  sidereal: Jul 16 – Aug 16
  pattern: >-
    Cancer takes care of everyone, remembers everything, and says nothing when it isn't
    returned. The caring is real. So is the quiet resentment that builds when nobody asks how
    you're doing.
  pen: >-
    Who did you take care of today? Now write one thing you did for yourself, or the one thing
    you'll do tomorrow.
  affirmation: Letting others know how I feel is taking care of my emotions.

- sign: Leo
  slug: leo
  asin: B0C47NHBDD
  buy: https://link.amazon/B0b3E9vR3
  element: Fire
  modality: Fixed
  ruler: Sun
  tropical: Jul 23 – Aug 22
  sidereal: Aug 17 – Sep 16
  pattern: >-
    Leo lights up a room, and plenty of Leos dim the second the room stops noticing. The warmth
    is yours. Needing an audience to feel it is the habit worth breaking.
  pen: >-
    Write one thing you're proud of from this week that nobody saw. Let it count anyway.
  affirmation: I radiate with self-confidence and self-esteem.

- sign: Virgo
  slug: virgo
  asin: B0C47LHTLR
  buy: https://link.amazon/B07dZYWJq
  element: Earth
  modality: Mutable
  ruler: Mercury
  tropical: Aug 23 – Sep 22
  sidereal: Sep 17 – Oct 16
  pattern: >-
    Virgo notices what's off, fixes it, then finds the next thing. Turned inward, that same
    eye makes "good enough" impossible, and done never feels done.
  pen: >-
    List three things you did well today. No "but" allowed after any of them.
  affirmation: I am not less for making mistakes. I am more because I learn from them.

- sign: Libra
  slug: libra
  asin: B0C47RV7MF
  buy: https://www.amazon.com/dp/B0C47RV7MF?tag=rogeniecord0c-20
  element: Air
  modality: Cardinal
  ruler: Venus
  tropical: Sep 23 – Oct 22
  sidereal: Oct 17 – Nov 15
  pattern: >-
    Libra keeps the peace, and a lot of Libras keep it by quietly dropping their own opinion.
    Everyone likes you. The question is whether they know what you actually want.
  pen: >-
    What did you agree to this week that you didn't want? Write what you'd have said if
    nobody would be upset.
  affirmation: I deserve to be treated with respect.

- sign: Scorpio
  slug: scorpio
  asin: B0C47TGW6W
  buy: https://www.amazon.com/dp/B0C47TGW6W?tag=rogeniecord0c-20
  element: Water
  modality: Fixed
  ruler: Mars (modern ruler Pluto)
  tropical: Oct 23 – Nov 21
  sidereal: Nov 16 – Dec 15
  pattern: >-
    Scorpio feels everything and shows almost none of it. Many Scorpios test people instead of
    telling them, and hold on to a hurt long after the person who caused it has moved on.
  pen: >-
    Write the thing you're still holding on to. Then write, honestly, what keeping it is
    costing you.
  affirmation: I release all past hurt and I am ready to be vulnerable in love again

- sign: Sagittarius
  slug: sagittarius
  asin: B0C2SM68MG
  buy: https://link.amazon/B07UvWDyu
  element: Fire
  modality: Mutable
  ruler: Jupiter
  tropical: Nov 22 – Dec 21
  sidereal: Dec 16 – Jan 13
  pattern: >-
    Sagittarius wants the next horizon, and when things get heavy, plenty of Sagittarians
    leave, on a plane or just in their heads. Freedom is the point. Using it as an exit is the
    pattern.
  pen: >-
    Where do you want to run right now? Write what you'd have to face if you stayed one more
    week.
  affirmation: I take a step forward every day, even if some days those steps are smaller

- sign: Capricorn
  slug: capricorn
  asin: B0C47SW53P
  buy: https://link.amazon/B0fu08QKH
  element: Earth
  modality: Cardinal
  ruler: Saturn
  tropical: Dec 22 – Jan 19
  sidereal: Jan 14 – Feb 12
  pattern: >-
    Capricorn gets it done, and a lot of Capricorns only let themselves rest once it's earned.
    When your worth is measured in output, a slow day starts to feel like failure.
  pen: >-
    Write what you'd do with a free afternoon if it didn't have to be productive. Then
    schedule it.
  affirmation: I am worthy of being loved every single day

- sign: Aquarius
  slug: aquarius
  asin: B0C47YG36K
  buy: https://link.amazon/B06aFYqqF
  element: Air
  modality: Fixed
  ruler: Saturn (modern ruler Uranus)
  tropical: Jan 20 – Feb 18
  sidereal: Feb 13 – Mar 13
  pattern: >-
    Aquarius can explain a feeling brilliantly without ever actually having it. Many
    Aquarians analyze their emotions from a safe distance, then wonder why people call them
    hard to reach.
  pen: >-
    Describe one feeling from today in a single word. No explanation, no theory.
  affirmation: Understanding my feelings helps me to learn about myself and what makes me tick.

- sign: Pisces
  slug: pisces
  asin: B0C47X1HJL
  buy: https://link.amazon/B0dnA7ePc
  element: Water
  modality: Mutable
  ruler: Jupiter (modern ruler Neptune)
  tropical: Feb 19 – Mar 20
  sidereal: Mar 14 – Apr 13
  pattern: >-
    Pisces absorbs the mood of every room, and plenty of Pisces carry other people's feelings
    home like their own. The empathy is a gift. Losing yourself in it isn't.
  pen: >-
    Whose feelings did you carry today? Hand them back on paper. Then write one feeling that's
    only yours.
  affirmation: I am allowed to detach from people and situations that threaten my joy
